server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/StockManagement}
    username: postgres
    password: docker
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: stock-management-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      direct:
        auto-startup: true
  jackson:
    default-property-inclusion: non_null

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}
  storage:
    driver: ${STORAGE_DRIVER:disk}
    directory: ${DIR_STORAGE:src/main/resources/static}
    folder: ${FOLDER_STORAGE:images/uploads}
  version: "2.0.0"

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}